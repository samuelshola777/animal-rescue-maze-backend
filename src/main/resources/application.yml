spring:
  application:
    name: animal-rescue-maze-backend
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

game:
  rows: 15
  columns: 15
  star-count: 10
  rescue-count: 3
  duration-seconds: 90
  maximum-sessions: 10000
  maximum-leaderboard-entries: 1000
  full-reset-milliseconds: 172800000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origin-patterns: ${ALLOWED_ORIGINS:http://localhost:*,https://*.vercel.app}
