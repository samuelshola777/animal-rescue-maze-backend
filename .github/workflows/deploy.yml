name: Deploy Animal Rescue Backend

on:
  push:
    branches:
      - main

concurrency:
  group: animal-rescue-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to OVH VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ubuntu
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" <<'DEPLOY'
              set -euo pipefail

              cd /opt/apps/animal-rescue

              git fetch origin main
              git reset --hard origin/main

              docker compose up -d --build --remove-orphans
              docker image prune -f
              docker compose ps
          DEPLOY